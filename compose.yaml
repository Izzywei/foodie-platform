name: foodie-recipes
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: foodie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodie-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U foodie -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: recipes
      PGUSER: foodie
      PGPASSWORD: ${POSTGRES_PASSWORD:-foodie-local-only}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
